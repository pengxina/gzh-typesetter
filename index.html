<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公众号图文排版工具 · 有图有文 · 一键复制</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f4c81'/%3E%3Cpath d='M6 20c4-5 6-8 10-14 4 6 6 9 10 14H20l-4-6-4 6H6z' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ui-bg:#eef1f5;--panel:#fff;--ink:#22303f;--ink-2:#5b6b7b;--line:#e3e8ee;
  --accent:#0f4c81;--accent-2:#2f80ed;--ok:#18a058;--shadow:0 10px 30px rgba(20,40,60,.08);
  --bar-h:56px;
}
html,body{height:100%;overflow:hidden}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:var(--ui-bg);color:var(--ink);font-size:14px;line-height:1.5;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}

.appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0f4c81,#0e63a8);color:#fff}
.appbar .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.appbar .logo{width:30px;height:30px;flex:none}
.appbar h1{font-size:16px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.appbar .sub{font-size:11px;opacity:.82;margin-top:1px;white-space:nowrap}
.appbar-actions{display:flex;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;font-size:13px;font-weight:600;transition:.15s;border:1px solid transparent}
.btn svg{width:15px;height:15px}
.btn-light{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.25)}
.btn-light:hover{background:rgba(255,255,255,.26)}
.btn-solid{background:#fff;color:#0f4c81}
.btn-solid:hover{filter:brightness(.97)}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:#f6f8fb}
.btn:disabled{opacity:.55;cursor:not-allowed}

.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;max-width:1200px;margin:0 auto;padding:18px 16px;height:calc(100vh - var(--bar-h));overflow:hidden}
.panel{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.editor{flex:1;min-height:0;display:flex;flex-direction:column}

.editor-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfcfe}
.step{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent)}
.step b{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px}
.editor-head .grow{flex:1}
.small-tip{font-size:11px;color:var(--ink-2)}

.themes{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.themes::-webkit-scrollbar{display:none}
.chip{padding:7px 12px;border-radius:20px;font-size:12.5px;font-weight:600;border:1.5px solid var(--line);color:var(--ink-2);background:#fff;transition:.15s}
.chip:hover{border-color:var(--accent-2);color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .chip-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

.settings{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);background:#fbfcfe}
.set{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink)}
.set label{color:var(--ink-2);white-space:nowrap}
.set input[type=range]{width:96px;accent-color:var(--accent)}
.set output{min-width:26px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.set.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.switch{position:relative;width:34px;height:19px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;border-radius:19px;background:#cfd8e3;transition:.2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{left:17px}

.input-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.input-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fbfcfe}
.toolb{border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:5px 10px;border-radius:7px;font-size:12px;font-weight:600;transition:.15s}
.toolb:hover{color:var(--accent);border-color:var(--accent-2)}
.toolb.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.toolb-sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.toolb-group{display:inline-flex;align-items:center;font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:1px;padding:0 2px}
.color-pop{display:none;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:#fff}
.color-pop.open{display:flex}
.sizeopt{border:1px solid var(--line);background:#fff;color:var(--ink-2);padding:4px 10px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
.sizeopt:hover{background:#eef3f9}
.view-switch{display:none;justify-content:center;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line)}
.vs{flex:1;max-width:230px;padding:8px 0;border:1px solid var(--line);background:#fff;color:var(--ink-2);border-radius:8px;font-size:13px;font-weight:600;transition:.15s}
.vs.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #d6dde5;transition:.12s}
.swatch:hover{transform:scale(1.15)}
.swatch-custom{width:auto;padding:0 10px;height:26px;border-radius:13px;font-size:12px;color:#fff;background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcB77,#4d96ff,#9b5de5);border:none;font-weight:600}
.textarea{flex:1;width:100%;min-height:0;overflow:auto;border:none;outline:none;resize:none;padding:16px;font-size:16px;line-height:1.7;color:var(--ink);background:transparent}
.textarea::placeholder{color:#a8b4c0}
.input-foot{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-top:1px solid var(--line);background:#fbfcfe;font-size:11.5px;color:var(--ink-2)}
.mark-hint{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 7px;border-radius:5px;background:#eef3f9;color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}

.phone-col{align-self:start;height:100%;min-height:0;position:sticky;top:0;display:flex;flex-direction:column;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fbfcfe;flex:none}
#previewInner ::selection{background:#cfe3ff;color:#111}
.phone-head{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);background:#fbfcfe}
.phone-head span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.phone-head .live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.phone{width:100%;max-width:430px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;background:#fbfcfe;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 18px 40px rgba(20,40,60,.14)}
.phone-top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:#fff;color:#000;font-size:10px;font-family:ui-monospace,Menlo,monospace}
.phone-notch{display:flex;gap:4px;align-items:center}
.phone-notch i{width:6px;height:6px;border-radius:50%;background:#dcdcdc}
.phone-account{display:flex;align-items:center;gap:9px;padding:13px 16px;background:#fff;border-bottom:1px solid #f0f0f0}
.phone-account .ava{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.phone-account .name{font-size:13px;font-weight:600;color:#222}
.phone-account .id{font-size:10.5px;color:#999;margin-top:1px}
.phone-scroll{flex:1;min-height:0;overflow:auto;background:#fff;padding:0}
#previewInner{padding:20px 16px 28px;word-break:break-word}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#22303f;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#18a058}
.empty-hint{color:#b6c2cd;text-align:center;padding:44px 16px;font-size:13px;line-height:2}
.empty-hint svg{width:34px;height:34px;margin-bottom:6px;opacity:.5}

@media (max-width:860px){
  :root{--bar-h:54px;--vs-h:46px}
  html,body{overflow:hidden;height:100%;height:100dvh}
  .appbar{position:fixed;top:0;left:0;right:0;z-index:50}
  .view-switch{display:flex;position:fixed;top:var(--bar-h);left:0;right:0;z-index:40;padding:7px 10px}
  body.view-edit #previewPanel{display:none}
  body.view-preview #editorPanel{display:none}
  .layout{position:fixed;left:0;right:0;top:calc(var(--bar-h) + var(--vs-h));bottom:0;display:block;overflow:hidden;margin:0;padding:0;max-width:none;height:auto}
  .editor{position:static;height:100%;margin:0;display:flex;flex-direction:column;overflow:hidden;box-shadow:none;border-radius:0;background:var(--panel)}
  .editor .themes{flex:none}
  .input-wrap{flex:1;min-height:0}
  .input-toolbar{flex:none}
  .textarea{flex:1;min-height:0;padding:14px 16px}
  .input-foot{flex:none}
  .phone-col{position:static;height:100%;flex:none;display:flex;flex-direction:column;overflow:hidden;border-radius:0;box-shadow:none;background:#fff}
  .phone-col .themes{flex:none}
  .pv-bar{flex:none}
  .phone{height:auto;flex:1;max-width:none;border-radius:0;border:none;background:#fff}
  .phone-scroll{flex:1;height:auto;min-height:0}
  .editor-head .small-tip{display:none}
  .appbar h1{font-size:14px}
  .appbar .sub{display:none}
}
@media (max-width:480px){
  .appbar{padding:8px 10px;flex-wrap:nowrap}
  .appbar-actions{width:auto;gap:6px}
  .appbar .logo{width:26px;height:26px}
  .appbar h1{font-size:13px}
  .btn{padding:6px 9px;font-size:12px;flex:none}
  .btn svg{width:13px;height:13px}
  .settings{gap:10px}
  .input-toolbar{flex-wrap:wrap}
}
</style>
</head>
<body class="view-edit">

<header class="appbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#fff"/><path d="M6 20c4-5 6-8 10-14 4 6 6 9 10 14H20l-4-6-4 6H6z" fill="#0f4c81"/></svg>
    <div>
      <h1>公众号图文排版工具</h1>
      <div class="sub">粘贴文字 + 插图 → 一键排版 → 复制到公众号</div>
    </div>

  <div class="appbar-actions">
    <button class="btn btn-light" id="btnDemo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h10"/></svg>示例</button>
    <button class="btn btn-light" id="btnClear" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M6 7l1 12h10l1-12"/></svg>清空</button>
    <button class="btn btn-solid" id="btnCopy" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>复制到公众号</button>
  </div>
</header>

<div class="view-switch" id="viewSwitch">
  <button class="vs on" data-v="edit" type="button">编辑</button>
  <button class="vs" data-v="preview" type="button">预览</button>
</div>

<main class="layout">
  <section class="panel editor" id="editorPanel">
    <div class="themes" id="themes"></div>
    <div class="input-wrap" id="inputWrap">
      <div class="input-toolbar">
        <button class="toolb" id="tbSize" type="button" title="调整字号">字号</button>
        <button class="toolb" id="tbColor" type="button" title="文字颜色">颜色</button>
        <button class="toolb" id="tbBold" type="button" title="加粗选中文字"><b>B</b> 加粗</button>
        <button class="toolb" id="tbItalic" type="button" title="斜体"><i>I</i> 斜体</button>
        <button class="toolb" id="tbUnder" type="button" title="下划线"><u>U</u> 下划线</button>
        <button class="toolb" id="tbDel" type="button" title="删除线"><s>S</s> 删除线</button>
        <button class="toolb" id="tbMark" type="button" title="背景高亮">高亮</button>
        <button class="toolb" id="tbGlobalIndent" type="button" title="全局首行缩进开关">全局缩进</button>
        <button class="toolb" id="tbClear" type="button" title="清除选中文字所有样式">清除样式</button>
        <button class="toolb" id="tbUndo" type="button" title="撤回上一步">撤回</button>
      </div>
      <div class="color-pop" id="colorPop">
        <span class="toolb-group">文字颜色：</span>
        <span class="swatch" data-c="ff3b30" style="background:#ff3b30"></span>
        <span class="swatch" data-c="ff9500" style="background:#ff9500"></span>
        <span class="swatch" data-c="ffd60a" style="background:#ffd60a"></span>
        <span class="swatch" data-c="34c759" style="background:#34c759"></span>
        <span class="swatch" data-c="0f4c81" style="background:#0f4c81"></span>
        <span class="swatch" data-c="7d9b7a" style="background:#7d9b7a"></span>
        <span class="swatch" data-c="af52de" style="background:#af52de"></span>
        <span class="swatch" data-c="333333" style="background:#333333"></span>
        <button class="swatch-custom" id="tbColorCustom" type="button">自定义色值</button>
        <span class="grow"></span>
        <button class="toolb" id="tbColorClose" type="button">收起</button>
      </div>
      <div class="color-pop" id="sizePop">
        <span class="toolb-group">字体大小：</span>
        <button class="sizeopt" data-sz="14">14</button>
        <button class="sizeopt" data-sz="16">16</button>
        <button class="sizeopt" data-sz="18">18</button>
        <button class="sizeopt" data-sz="20">20</button>
        <button class="sizeopt" data-sz="24">24</button>
        <button class="sizeopt" data-sz="28">28</button>
        <span class="grow"></span>
        <button class="toolb" id="tbSizeClose" type="button">收起</button>
      </div>
      <textarea class="textarea" id="input" spellcheck="false" placeholder="粘贴文字资料（兼容标准 Markdown）或先输入内容。支持：# 标题、## 小标题、**加粗**、*斜体*、~~删除线~~、==高亮==、&gt; 引用、- 列表、--- 分隔线、![图注](图片链接)、[文字](网址)。可选中文字后用工具栏按钮设置字号、颜色。"></textarea>
      <div class="input-foot">
        <span id="stats">0 字</span>
      </div>
    </div>
  </section>

  <aside class="phone-col" id="previewPanel">
    <div class="themes" id="pvThemes"></div>
    <div class="pv-bar">
      <button class="toolb" id="pvSize" type="button" title="调整字号">字号</button>
      <button class="toolb" id="pvColor" type="button" title="文字颜色">颜色</button>
      <button class="toolb" id="pvBold" type="button" title="加粗选中文字"><b>B</b> 加粗</button>
      <button class="toolb" id="pvItalic" type="button" title="斜体"><i>I</i> 斜体</button>
      <button class="toolb" id="pvUnder" type="button" title="下划线"><u>U</u> 下划线</button>
      <button class="toolb" id="pvDel" type="button" title="删除线"><s>S</s> 删除线</button>
      <button class="toolb" id="pvMark" type="button" title="背景高亮">高亮</button>
      <button class="toolb" id="pvGlobalIndent" type="button" title="全局首行缩进开关">全局缩进</button>
      <button class="toolb" id="pvClear" type="button" title="清除选中文字所有样式">清除样式</button>
      <button class="toolb" id="pvUndo" type="button" title="撤回上一步">撤回</button>

      <span class="swatch" data-c="af52de" style="background:#af52de"></span>
      <span class="swatch" data-c="333333" style="background:#333333"></span>
      <button class="swatch-custom" id="pvColorCustom" type="button">自定义色值</button>
      <span class="grow"></span>
      <button class="toolb" id="pvColorClose" type="button">收起</button>
    </div>
    <div class="color-pop" id="pvSizePop">
      <span class="toolb-group">字体大小：</span>
      <button class="sizeopt" data-sz="14">14</button>
      <button class="sizeopt" data-sz="16">16</button>
      <button class="sizeopt" data-sz="18">18</button>
      <button class="sizeopt" data-sz="20">20</button>
      <button class="sizeopt" data-sz="24">24</button>
      <button class="sizeopt" data-sz="28">28</button>
      <span class="grow"></span>
      <button class="toolb" id="pvSizeClose" type="button">收起</button>

    <div class="phone">
      <div class="phone-top"><span>09:41</span><span class="phone-notch"><i></i><i></i><i></i></span><span>5G</span></div>
      <div class="phone-account">
        <div class="ava" id="phoneAva">文</div>

      <div class="phone-scroll" id="phoneScroll"><div id="previewInner"></div></div>
    </div>
  </aside>
</main>

    boldColor:'#5f7d5e', keyBg:'#f1f5ee',
    quoteBg:'#f1f5ee', quoteBorder:'#9db89a', quoteColor:'#5a6b57',
    divider:'dot', imgRadius:8, caption:'#a3b09f', imgShadow:false },
  { key:'card', name:'卡片', desc:'卡片图文', dot:'#c0392b',
    bodyBg:'#ffffff', bodyColor:'#333333', bodyAlign:'left', line:1.75,
    t1Color:'#ffffff', t1Style:'block', t1Accent:'#c0392b',

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg, ok){ toastEl.textContent=msg; toastEl.className='toast show'+(ok?' ok':''); clearTimeout(toast._t); toast._t=setTimeout(function(){toastEl.className='toast';},2200); }
function debounce(fn,w){ var t; return function(){ var a=arguments,c=this; clearTimeout(t); t=setTimeout(function(){fn.apply(c,a);},w); }; }

/* 内联格式（Markdown）：**加粗**、__加粗__、*斜体*、~~删除线~~、==高亮==、[链接](url)、%%下划线%%（扩展）、{#hex}颜色{/} */
/* LaTeX 数学符号 → 可读文本（Obsidian 风格）：$180^\circ$ → 180° */
var SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
var SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','-':'₋'};
function latexInner(m){
  return m
    .replace(/\\%/g,'%')
    .replace(/\^\\circ/g,'°').replace(/\^\\degree/g,'°')
    .replace(/\\circ/g,'°').replace(/\\degree/g,'°')
    .replace(/\\times/g,'×').replace(/\\div/g,'÷').replace(/\\pm/g,'±')
    .replace(/\\leq/g,'≤').replace(/\\geq/g,'≥').replace(/\\neq/g,'≠')
    .replace(/\\approx/g,'≈').replace(/\\cdot/g,'·').replace(/\\sqrt/g,'√')
    .replace(/\\pi/g,'π').replace(/\\alpha/g,'α').replace(/\\beta/g,'β')
    .replace(/\\gamma/g,'γ').replace(/\\theta/g,'θ').replace(/\\Delta/g,'Δ')
    .replace(/\\infty/g,'∞').replace(/\\angle/g,'∠').replace(/\\parallel/g,'∥')
    .replace(/\\perp/g,'⊥').replace(/\\triangle/g,'△').replace(/\\therefore/g,'∴')
    .replace(/\\because/g,'∵')
    .replace(/\^\{([0-9-]+)\}/g,function(_,d){ return d.split('').map(function(c){return SUP[c]||c;}).join(''); })
    .replace(/\^([0-9-])/g,function(_,d){ return SUP[d]||d; })
    .replace(/\_\{([0-9-]+)\}/g,function(_,d){ return d.split('').map(function(c){return SUB[c]||c;}).join(''); })
    .replace(/\_([0-9-])/g,function(_,d){ return SUB[d]||d; })
    .replace(/\s+/g,' ').trim();
}
function latexClean(s){
  /* 仅当 $...$ 内确实含 LaTeX 特征（反斜杠命令、上标/下标）时才转换，
     普通文本里的 $（如价格 $100、$200）原样保留 */
  var isLatex=function(m){ return /\\[a-zA-Z%]|\^[0-9{(-]|_[0-9{(-]/.test(m); };
  return s
    .replace(/\$\$([^$]+)\$\$/g,function(_,m){ return isLatex(m)?latexInner(m):'$$'+m+'$$'; })
    .replace(/\$([^$]+)\$/g,function(_,m){ return isLatex(m)?latexInner(m):'$'+m+'$'; });
}
function inlineFmt(text, accent, keyBg){
  text = latexClean(text);
  var t = esc(text);
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:#0f4c81;text-decoration:none;">$1</a>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong style="color:'+accent+';font-weight:700;background:'+keyBg+';padding:0 2px;border-radius:3px;">$1</strong>');
  t = t.replace(/(^|[^_])__([^_]+)__/g, '$1<strong style="color:'+accent+';font-weight:700;background:'+keyBg+';padding:0 2px;border-radius:3px;">$2</strong>');
  t = t.replace(/~~([^~]+)~~/g, '<del style="text-decoration:line-through;color:#9aa0a6;">$1</del>');
  t = t.replace(/%%([^%]+)%%/g, '<u style="text-decoration:underline;">$1</u>');
  t = t.replace(/==([^=]+)==/g, '<mark style="background:#ffe58a;color:#5b3a00;padding:0 3px;border-radius:3px;">$1</mark>');
  t = t.replace(/\{size:(\d+)\}/g, '<span style="font-size:$1px;">');
  t = t.replace(/\{#([0-9a-fA-F]{6})\}/g, '<span style="color:#$1;">');
  t = t.replace(/\{\/\}/g, '</span>');
  var _o=(t.match(/<span /g)||[]).length, _c=(t.match(/<\/span>/g)||[]).length;
  if(_o>_c) t+='</span>'.repeat(_o-_c);
  t = t.replace(/\*([^*]+)\*/g, '<em style="font-style:italic;">$1</em>');
  return t;
}

/* ===== 撤回上一步 ===== */
var undoStack=[];
function snapshot(){
  if(!undoStack.length || undoStack[undoStack.length-1]!==input.value){
    undoStack.push(input.value);
    if(undoStack.length>60)undoStack.shift();
  }
}
function doUndo(){
  if(undoStack.length<=1){ toast('没有可撤回的操作'); return; }
  undoStack.pop();
  input.value=undoStack[undoStack.length-1];
  render();
}

/* 判断选中文字是否已完全被该标记包裹（用于切换：点一下加粗，再点一下取消） */
function isWrapped(pre, post, before, after){
  if(!before || !after) return false;
  if(pre.slice(-before.length)!==before || post.slice(0,after.length)!==after) return false;
  /* 防止斜体 * 与加粗 ** 前缀冲突误判：* 的判定排除 ** 结尾；** 判定排除 *** */
  if(before==='*' && pre.slice(-2)==='**') return false;
  if(before==='**' && pre.slice(-3)==='***') return false;
  if(before==='__' && pre.slice(-3)==='___') return false;
  if(before==='==' && pre.slice(-3)==='===') return false;
  if(before==='~~' && pre.slice(-3)==='~~~') return false;
  if(before==='%%' && pre.slice(-3)==='%%%') return false;
  return true;
}
/* 选中文字包裹标记（切换模式：已包裹则取消，未包裹则加上）；未选中则提示，不插入任何内容 */
function wrapSelection(before, after, placeholder){
  var g=getSel(), s=g[0], e=g[1];
  if(s===e){ toast('请先选中要设置的文字'); return; }
  var v=input.value, pre=v.slice(0,s), post=v.slice(e);
  if(isWrapped(pre, post, before, after)){
    var ns=s-before.length, ne=e+after.length;
    input.value=v.slice(0,ns)+v.slice(s,e)+v.slice(ne);
    input.selectionStart=ns;
    input.selectionEnd=ns+(e-s);
    input.focus({preventScroll:true});
    snapshot();
    render();
    return;
  }
  var sel = input.value.slice(s, e);
  input.value = input.value.slice(0, s) + before + sel + after + input.value.slice(e);
  input.selectionStart = s + before.length;
  input.selectionEnd = e + before.length;
  input.focus({preventScroll:true});
  snapshot();
  render();
}

function renderThemes(){

/* ===== 解析：文本 → 结构块 ===== */
function parse(text){
  var lines = text.split(/\r?\n/);
  var blocks=[], buf=[], list=null;
  /* 段落内每一行在预览中独立成行（硬换行），空行分段 */
  function flushPara(){ if(buf.length){
    var j=buf.map(function(l){ return l.replace(/BR$/,''); }).join('\n').trim();
    if(j) blocks.push({type:'p',text:j});
    buf=[];
  } }
  function flushList(){ if(list){ blocks.push(list); list=null; } }
  function flush(){ flushPara(); flushList(); }
  lines.forEach(function(raw){
    var raw2 = raw.replace(/^\uFEFF/,'');
    var hard = /( {2,}|\\+)$/.test(raw2);
    var s = raw2.trim();
    if(!s){ flush(); return; }
    // 视频：![v:标题](链接)
    var vidM = s.match(/^!\[v:([^\]]*)\]\(([^)]+)\)$/);
    if(vidM){ flush(); blocks.push({type:'video',url:vidM[2].trim(),title:vidM[1].trim()}); return; }
    // 图片：![图注](URL) 或 ![图注](@imgN)
    var imgM = s.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(imgM){ flush(); blocks.push({type:'img',url:imgM[2].trim(),caption:imgM[1].trim()}); return; }
    if(/^#{1,3}\s+/.test(s)){ flush();
      var m=s.match(/^(#{1,3})\s+(.*)$/); blocks.push({type:(m[1].length>=2?'h2':'h1'),text:m[2].trim()}); return; }
    if(/^>\s?/.test(s)){ flush(); var q=s.replace(/^>\s?/,'').trim(); if(q) blocks.push({type:'quote',text:q}); return; }
    // 无序列表
    if(/^(\*|-)\s+/.test(s)){ flushPara();
      var li=s.replace(/^(\*|-)\s+/,'').trim();
      if(li){ if(!list || list.ordered) list={type:'list',ordered:false,items:[]}; list.items.push(li); }
      return; }
    // 有序列表
    if(/^\d+[.、]\s+/.test(s)){ flushPara();
      var li2=s.replace(/^\d+[.、]\s+/,'').trim();
      if(li2){ if(!list || !list.ordered) list={type:'list',ordered:true,items:[]}; list.items.push(li2); }
      return; }
    if(/^\s*(?:\*{3,}|-{3,}|_{3,}|\* \* \*|- - -)\s*$/.test(s)){ flush(); blocks.push({type:'hr'}); return; }
    if(hard){ s += 'BR'; }
    buf.push(s);
  });
  flush();
  return blocks;
}

      } else if(T.t1Style==='center-line'){

           '<div style="margin:0 auto '+(opts.para+2)+'px auto;width:52px;height:2px;background:'+T.t1Accent+';border-radius:1px;"></div>';
      } else if(T.t1Style==='big-center'){

           '<div style="width:44px;height:2px;background:'+T.t1Accent+';margin:0 auto '+(opts.para+2)+'px auto;"></div>';

    case 'h2': {

      } else if(T.t2Style==='number'){

  return h;
}

function render(){
  var opts={size:state.size,line:state.line,para:state.para};
  var blocks=parse(input.value), html='';
  /* 保留预览区当前滚动位置：手机上在预览页编辑文字时，页面不应跳回开头 */
  var keepTop=phoneScroll.scrollTop;
  if(!blocks.length){
    html='<div class="empty-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16M4 12h16M4 19h10"/></svg>在左侧粘贴文字、插入图片，&#10;这里会实时显示图文排版效果</div>';
  } else {
    var h2i=0;
    window._blocks=blocks;
    blocks.forEach(function(b,i){ if(b.type==='h2') h2i++; html+='<div data-bx="'+i+'">'+renderBlock(b,opts,h2i)+'</div>'; });
  }
  preview.innerHTML=html;
  phoneScroll.scrollTop=keepTop;
  syncGlobalIndent();
  var n=input.value.replace(/\s/g,'').length;
  document.getElementById('stats').textContent = n ? n+' 字 · 已自动排版' : '0 字';
}

});
function syncGlobalIndent(){
  var on=!!state.indent;
  var a=document.getElementById('tbGlobalIndent'); if(a) a.classList.toggle('on', on);
  var b=document.getElementById('pvGlobalIndent'); if(b) b.classList.toggle('on', on);
}
var dRender=debounce(render,180);
input.addEventListener('input', function(){ dRender(); snapshot(); });

/* ===== 快捷插入 ===== */
function insertAtCursor(text){
  var s=input.selectionStart, e=input.selectionEnd;
  input.value=input.value.slice(0,s)+text+input.value.slice(e);
  input.selectionStart=input.selectionEnd=s+text.length;
  input.focus();
  snapshot();

/* 改字号/颜色的统一入口：把选中区连同其前后的完整样式标记整组吸收，
   目标类型剥旧换新、其他类型标记按原顺序保留，闭标记数量对齐，杜绝嵌套与不平衡。
   isTarget(m)：判断开标记是否本次要改的目标类型（如颜色 {#hex} 或字号 {size:N}） */
function repackFmt(isTarget, open, close, pop){
  var g=getSel(), s=g[0], e=g[1];
  if(s===e){ wrapSelection(open,close,'样式文字'); if(pop)pop(); return; }
  var v=input.value, pre=v.slice(0,s);
  var ns=s, probe=pre, keeps=[], nclose=0;
  while(true){
    var m=probe.match(/(\{size:\d+\}|\{#[0-9a-fA-F]{6}\})$/);
    if(!m) break;
    if(!isTarget(m[0])) keeps.unshift(m[0]); /* 非目标类型的标记保留原顺序 */
    ns-=m[0].length;
    probe=probe.slice(0,probe.length-m[0].length);
  }
  while(v.slice(e+nclose*3,e+nclose*3+3)==='{/}'){ nclose++; }
  var ne=e+nclose*3;
  var seg=v.slice(ns,ne).replace(/\{size:\d+\}/g,'').replace(/\{#[0-9a-fA-F]{6}\}/g,'').replace(/\{\/\}/g,'');
  /* 闭标记数：保证每个保留的开标记 + 新开标记都各有一个闭；至少补足 keeps.length+1 个 */
  var tcount=Math.max(nclose, keeps.length+1);
  var tail=''; for(var i=0;i<tcount;i++) tail+='{/}';
  input.value=v.slice(0,ns)+keeps.join('')+open+seg+tail+v.slice(ne);
  var pos=ns+keeps.join('').length+open.length;
  input.selectionStart=pos; input.selectionEnd=pos+seg.length;
  input.focus({preventScroll:true}); snapshot(); render();
  if(pop)pop();
}

/* 清除选中文字的所有格式标记 */
function stripFmt(s){
  return s
    .replace(/\*\*([^*]+)\*\*/g,'$1')
    .replace(/__([^_]+)__/g,'$1')
    .replace(/~~([^~]+)~~/g,'$1')
    .replace(/==([^=]+)==/g,'$1')
    .replace(/%%([^%]+)%%/g,'$1')
    .replace(/\{#[0-9a-fA-F]{6}\}/g,'')
    .replace(/\{size:\d+\}/g,'')
    .replace(/\{\/\}/g,'')
    .replace(/\*([^*]+)\*/g,'$1');
}
/* 把选中范围扩展到所在行内包裹它的完整格式标记，保证清除样式能剥到标记本身 */
function expandToFmt(v, s, e){
  var lineStart=v.lastIndexOf('\n',s-1)+1;
  var lineEnd=v.indexOf('\n',e); if(lineEnd<0) lineEnd=v.length;
  var line=v.slice(lineStart,lineEnd);
  var off=lineStart, ns=s, ne=e;
  var pats=[/\*\*([^*]+)\*\*/g,/==([^=]+)==/g,/%%([^%]+)%%/g,/~~([^~]+)~~/g,/\*([^*]+)\*/g];
  pats.forEach(function(re){
    var m;
    while((m=re.exec(line))!==null){
      var os=off+m.index, oe=off+m.index+m[0].length;
      if(os<=s && oe>=e){ if(os<ns)ns=os; if(oe>ne)ne=oe; }
    }
  });
  /* 循环吸收连续的 {size}/{#hex} 开标记（不得越过 {/}）与 {/} 闭标记 */
  var pre=v.slice(lineStart,ns), post=v.slice(ne,lineEnd);
  var probe=pre;
  while(true){
    var m=probe.match(/(\{size:\d+\}|\{#[0-9a-fA-F]{6}\})$/);
    if(!m) break;
    var r=probe.slice(0,probe.length-m[0].length);
    if(r.indexOf('{/}')>=0) break;
    ns-=m[0].length;
    probe=r;
  }
  while(post.indexOf('{/}')===0){ ne+=3; post=post.slice(3); }
  return [ns,ne];
}

  input.selectionStart=ns; input.selectionEnd=ns+cleaned.length;
  input.focus(); snapshot(); render();
});

/* 预览区操作：划选局部文字 → 定位源文本；点某一段 → 选中整段。选中后保留蓝色高亮，供工具栏直接修改 */
/* 手机上划选预览文字时，原生文本选择菜单会弹出；用 selectionchange 实时把选中内容映射到源文本选区 */
document.addEventListener('selectionchange',function(){
  if(window._copySel) return; /* 复制全选预览时不污染编辑框选区 */
  var gs=window.getSelection();
  if(!gs || !gs.anchorNode || gs.isCollapsed || !preview.contains(gs.anchorNode)) return;
  var txt=gs.toString();
  if(!txt || !txt.trim()) return;
  /* 预览中划选/点击发生的新选择，始终覆盖编辑框旧选区，保证后续命令作用在新选择上 */
  var ix=input.value.indexOf(txt);
  if(ix>=0){ input.selectionStart=ix; input.selectionEnd=ix+txt.length; }
});
/* 获取当前有效选区：预览中有系统选中时优先使用（避免连续编辑执行在旧选区）；否则用编辑框选区 */
function getSel(){
  var gs=window.getSelection();
  if(gs && gs.anchorNode && !gs.isCollapsed && preview.contains(gs.anchorNode)){
    var txt=gs.toString();
    if(txt && txt.trim()){
      var ix=input.value.indexOf(txt);
      if(ix>=0) return [ix, ix+txt.length];
    }
  }
  var s=input.selectionStart, e=input.selectionEnd;
  return [s,e];
}
preview.addEventListener('click',function(e){
  var gs=window.getSelection();
  if(gs && !gs.isCollapsed && gs.toString().trim()){
    var txt=gs.toString().trim();
    var ix=input.value.indexOf(txt);
    if(ix>=0){ input.selectionStart=ix; input.selectionEnd=ix+txt.length; }
    return;
  }
  var el=e.target && e.target.closest ? e.target.closest('[data-bx]') : null;
  if(!el) return;
  var i=+el.getAttribute('data-bx');
  var blk=window._blocks && window._blocks[i];
  if(!blk) return;
  var raw=blk.raw||blk.text||blk.caption||'';
  if(!raw) return;
  var idx=input.value.indexOf(raw);
  if(idx>=0){ input.selectionStart=idx; input.selectionEnd=idx+raw.length; }
  // 在预览中选中该段，显示蓝色选中背景
  try{
    var r=document.createRange();
    r.selectNodeContents(el);
    gs.removeAllRanges();
    gs.addRange(r);
  }catch(err){}
});
